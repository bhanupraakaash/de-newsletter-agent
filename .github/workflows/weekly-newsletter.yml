name: Weekly Newsletter

on:
  schedule:
    - cron: "0 7 * * 1"   # every Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the newsletter but do not email it"
        type: boolean
        default: true
      no_llm:
        description: "Skip Claude (free run, Python ranking only)"
        type: boolean
        default: false

permissions:
  contents: write   # needed to update the "state" branch that stores the SQLite database

concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Restore database (dedup memory)
        run: bash scripts/sync_state.sh pull

      - name: Generate and send newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          NO_LLM: ${{ github.event_name == 'workflow_dispatch' && inputs.no_llm }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$NO_LLM" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          python -m src.main $ARGS

      - name: Show run summary
        if: always()
        run: |
          if [ -f output/run_summary.md ]; then cat output/run_summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save database (runs even on failure, so spend is never lost)
        if: always()
        run: bash scripts/sync_state.sh push

      - name: Upload newsletter preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-preview
          path: output/
          if-no-files-found: ignore
          retention-days: 30
